name: Update calendar
on:
  schedule:
    # GitHub often starts scheduled jobs late, or skips them. So each run keeps
    # going for up to ~5h40m, checking every 5 minutes, and a fresh run every
    # 2 hours takes over. Weekdays, plus Sunday evening for Asia's Monday.
    - cron: "17 */2 * * 1-5"
    - cron: "17 20,22 * * 0"
    # Saturday: load next week
    - cron: "0 9 * * 6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check every 5 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          # Saturday: one check is enough
          [ "$(date -u +%u)" = "6" ] && end=0
          while :; do
            python3 scripts/fetch.py || echo "fetch failed, will retry"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -q -m "Update calendar"
              git pull -q --rebase origin main && git push -q || echo "push failed, will retry"
            fi
            [ "$(date +%s)" -ge "$end" ] && break
            sleep 300
          done
